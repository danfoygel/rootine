name: Rootine

options:
  bundleIdPrefix: com.danfoygel
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ZVU48K8YCD
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Rootine:
    type: application
    platform: iOS
    sources:
      - Rootine
      - Shared
    dependencies:
      - target: RootineWatch
    # CloudKit sync. Both apps share one container; aps-environment lets CloudKit push changes.
    entitlements:
      path: Rootine/Rootine.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.danfoygel.rootine]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
        # HealthKit, read only (DATA.md phase 2). Background delivery wakes the app for new samples.
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    # Keys with no INFOPLIST_KEY_ build setting; merged with the generated Info.plist.
    info:
      path: Rootine/Info.plist
      properties:
        UIBackgroundModes: [remote-notification]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danfoygel.rootine
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rootine
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Rootine reads the Health data your items are linked to, such as steps or blood pressure readings, so they complete on their own."

  RootineWatch:
    type: application
    platform: watchOS
    sources:
      - RootineWatch
      - Shared
    dependencies:
      - target: RootineWatchWidgets
    # The App Group carries the today glance to the complications extension.
    entitlements:
      path: RootineWatch/RootineWatch.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.danfoygel.rootine]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
        com.apple.security.application-groups: [group.com.danfoygel.rootine]
    info:
      path: RootineWatch/Info.plist
      properties:
        WKBackgroundModes: [remote-notification]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danfoygel.rootine.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rootine
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.danfoygel.rootine

  # Watch complications. Reads the today glance the Watch app writes to the App Group; no store access.
  RootineWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - RootineWatchWidgets
      - Shared/Glance
      - Shared/Scheduling
      - Shared/Presentation/ItemAppearance.swift
    entitlements:
      path: RootineWatchWidgets/RootineWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.danfoygel.rootine]
    info:
      path: RootineWatchWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danfoygel.rootine.watchkitapp.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rootine

  # Hostless logic tests: Shared/ is compiled straight into the bundle.
  RootineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RootineTests
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danfoygel.rootine.tests
        GENERATE_INFOPLIST_FILE: YES

  # iPhone UI smoke tests (TESTING.md §8). In-memory seeded store and a fixed clock via launch arguments.
  RootineUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - RootineUITests
    dependencies:
      - target: Rootine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danfoygel.rootine.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Rootine

  # The same tests built for watchOS, to catch platform differences in Shared/.
  RootineWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - RootineTests
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danfoygel.rootine.watchkitapp.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Rootine:
    build:
      targets:
        Rootine: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RootineTests
  RootineWatch:
    build:
      targets:
        RootineWatch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RootineWatchTests
  RootineUITests:
    build:
      targets:
        Rootine: all
        RootineUITests: [test]
    test:
      config: Debug
      targets:
        - RootineUITests
