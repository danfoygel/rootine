name: Rootine

options:
  bundleIdPrefix: com.danfoygel
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ZVU48K8YCD
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Rootine:
    type: application
    platform: iOS
    sources:
      - Rootine
      - Shared
    dependencies:
      - target: RootineWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danfoygel.rootine
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rootine
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait

  RootineWatch:
    type: application
    platform: watchOS
    sources:
      - RootineWatch
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danfoygel.rootine.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rootine
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.danfoygel.rootine

  # Hostless logic tests: Shared/ is compiled straight into the bundle.
  RootineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RootineTests
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danfoygel.rootine.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Rootine:
    build:
      targets:
        Rootine: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RootineTests
  RootineWatch:
    build:
      targets:
        RootineWatch: all
    run:
      config: Debug
